name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-php:
    name: PHP syntax check
    runs-on: ubuntu-latest
    # PHP 7.4 は ubuntu-latest 標準にも含まれず shivammathur/setup-php もポリシー違反で
    # 起動不可のため、公式 PHP コンテナを container として利用する。
    container: php:7.4-cli
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # 1 ファイルでも syntax error があれば赤にする。元実装は `|| true` で常に成功扱いだった。
      # `php:7.4-cli` (debian) のデフォルトシェルは dash で `pipefail` 非対応のため
      # bash を明示し、bash が無い場合は apt で入れる。
      - name: Install bash (for pipefail)
        run: |
          set -eu
          if ! command -v bash >/dev/null 2>&1; then
            apt-get update && apt-get install -y --no-install-recommends bash
          fi
      - name: PHP Lint
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" >/dev/null; then
              echo "::error file=${file}::PHP syntax error"
              fail=1
            fi
          done < <(find html/ -name "*.php" -type f -print0)
          exit "$fail"

  lint-docker:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # サードパーティ Action を使わず GitHub Release から直接導入する。
      # 理由: Actions ポリシーが sha_pinning_required + selected (github_owned/verified のみ)
      # で、未 verified の hadolint/hadolint-action は SHA ピンしても startup_failure になるため。
      # SHA256 は公式 release artifact 実測値 (v2.12.0 を更新する場合は要更新)。
      - name: Install Hadolint
        env:
          HADOLINT_VERSION: v2.12.0
          HADOLINT_SHA256: 56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          echo "${HADOLINT_SHA256}  /tmp/hadolint" | sha256sum -c -
          chmod +x /tmp/hadolint
          sudo mv /tmp/hadolint /usr/local/bin/hadolint

      - name: Run Hadolint
        run: hadolint Dockerfile

  security-scan-docker:
    name: Trivy image scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t img2txt:${{ github.sha }} .

      # aquasecurity/trivy-action もポリシー違反のため、公式 release から CLI を直接導入する
      # (.github/workflows/trivy.yml の filesystem スキャンと同じ方式)。
      - name: Install Trivy
        env:
          TRIVY_VERSION: v0.70.0
        run: |
          set -euo pipefail
          ARCH=Linux-64bit
          BASE_URL="https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}"
          TARBALL="trivy_${TRIVY_VERSION#v}_${ARCH}.tar.gz"
          curl -sSfL -o "/tmp/${TARBALL}" "${BASE_URL}/${TARBALL}"
          curl -sSfL -o /tmp/trivy_checksums.txt "${BASE_URL}/trivy_${TRIVY_VERSION#v}_checksums.txt"
          (cd /tmp && grep "${TARBALL}" trivy_checksums.txt | sha256sum -c -)
          tar -xzf "/tmp/${TARBALL}" -C /tmp trivy
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy

      # Issue #20 で Dockerfile を alpine:3.22 + Go 1.26 マルチステージへ刷新し、
      # 旧 base image (genzouw/ansize:1.0.3 / alpine 3.10.3 EOL) 由来の CVE を解消した。
      # CRITICAL/HIGH + --ignore-unfixed で 0 件を維持するため exit-code 1 で blocking する。
      - name: Run Trivy on built image
        run: |
          trivy image \
            --format sarif \
            --output trivy-image.sarif \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --scanners vuln,secret \
            --exit-code 1 \
            "img2txt:${{ github.sha }}"

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@78ed0c7291d93e40c51b085850dc669a4c3ab73b # v3
        with:
          sarif_file: "trivy-image.sarif"
          category: trivy-image
