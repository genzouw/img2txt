name: TruffleHog Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 21 * * 0"
  workflow_dispatch:

concurrency:
  group: trufflehog-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trufflehog:
    name: Scan for leaked secrets with TruffleHog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install TruffleHog
        env:
          TRUFFLEHOG_VERSION: 3.81.9
        run: |
          set -euo pipefail
          TARBALL="trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          BASE_URL="https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}"
          curl -sSfL -o "/tmp/${TARBALL}" "${BASE_URL}/${TARBALL}"
          curl -sSfL -o /tmp/checksums.txt "${BASE_URL}/trufflehog_${TRUFFLEHOG_VERSION}_checksums.txt"
          (cd /tmp && grep "${TARBALL}" checksums.txt | sha256sum -c -)
          tar -xzf "/tmp/${TARBALL}" -C /tmp trufflehog
          sudo install -m 0755 /tmp/trufflehog /usr/local/bin/trufflehog

      - name: Run TruffleHog
        run: |
          trufflehog git file://. \
            --no-update \
            --only-verified \
            --fail
