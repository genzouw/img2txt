name: markdownlint

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".markdownlint-cli2.jsonc"
      - ".github/workflows/markdownlint.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.md"
      - ".markdownlint-cli2.jsonc"
      - ".github/workflows/markdownlint.yml"

concurrency:
  group: markdownlint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdownlint:
    name: markdownlint-cli2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # サードパーティ Action を使わず npm から直接導入する。
      # 理由: 本リポジトリの Actions ポリシーは sha_pinning_required + selected
      # (github_owned/verified のみ許可) で、未 verified の DavidAnson/markdownlint-cli2-action
      # は SHA ピンしても startup_failure になるため。
      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2@0.22.1

      - name: Run markdownlint-cli2
        run: markdownlint-cli2 --config .markdownlint-cli2.jsonc "**/*.md"
