repos:
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.21.2
  hooks:
  - id: gitleaks
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: detect-private-key
  - id: detect-aws-credentials
    args:
    - --allow-missing-credentials
  - id: check-merge-conflict
  - id: check-added-large-files
  - id: no-commit-to-branch
- repo: https://github.com/trufflesecurity/trufflehog
  rev: v3.95.6
  hooks:
  - id: trufflehog
- repo: https://github.com/woodruffw/zizmor-pre-commit
  rev: v1.4.1
  hooks:
  - id: zizmor
- repo: https://github.com/rhysd/actionlint
  rev: v1.7.7
  hooks:
  - id: actionlint
- repo: local
  hooks:
  - id: forbid-ai-traces
    name: Forbid AI agent traces
    entry: AI agent trace files (e.g. .claude, .cursor, .aider) are not allowed to be committed.
    language: fail
    files: '(?i)(?:^|/)\.(claude|cursor|aider|gemini|windsurf|cline|roo|codeium|continue|pearai|trae|cody)(?:/|$)'
    exclude: '(?i)(?:^|/)\.cursor/rules/'
  - id: forbid-ai-logs
    name: Forbid AI agent chat logs and MCP settings
    entry: AI agent chat logs and MCP settings files must not be committed (no exclusion, even under .cursor/rules/).
    language: fail
    files: '(?i)(?:^|/)(?:.*\.aider\.chat\.history\.md|\.cline_mcp_settings\.json)$'
  - id: forbid-env-local
    name: Forbid .env.local files
    entry: .env.local and similar local env files must not be committed.
    language: fail
    files: '(?i)(?:^|/)\.env\..*local$'
