# CodeRabbit configuration
# https://docs.coderabbit.ai/reference/configuration

language: "ja-JP"
early_access: false
enable_free_tier: true

reviews:
  # PHP + Docker で構築された画像→ASCII アート Web API を OSS として配布しているリポジトリのため、利用者環境への影響と公開 API としての脆弱性を取りこぼしたくない。
  # "assertive" で検出感度を高めに保ち、ノイズが過剰になった場合は "chill" に戻すことも検討する。
  profile: "assertive"

  # PR 全体に対する指針。path_instructions に "**/*" を入れるとファイル毎に
  # 繰り返し適用されてノイズが増えるため、広範な指示は instructions に集約する。
  instructions: |
    変更がプロジェクト全体に与える影響や、アーキテクチャの観点など、広いスコープからコードレビューを行ってください。必ず日本語でコメントしてください。
    公開リポジトリで管理される Web アプリ／フロントエンドである点を考慮し、以下の観点を強調し、重要視して必ずレビューに盛り込んでください:
    - 認証情報、API キー、トークン、内部 URL などの秘密情報がコード・ログ・ビルド成果物に混入していないこと。
    - XSS / CSRF / SQL インジェクション / 認可不足 / パストラバーサルなどユーザーに害を与え得る脆弱性が無いこと。
    - 外部入力 (URL / フォーム / API リクエスト) のバリデーションが抜けていないこと。

  # CodeRabbit を bot reviewer として動作させる。問題なしと判断した PR に対して
  # Approve ステータスを返す。個人運営での self-merge 運用 (PR 作成者は自分の
  # PR を承認できない GitHub 仕様) を補助する目的で有効化。Approve は最終判断
  # ではなく補助。
  request_changes_workflow: true

  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

  path_instructions:
    - path: "Dockerfile*"
      instructions: |
        Dockerfile としてレビューしてください:
        - ベースイメージのバージョンが固定 (タグ pin / digest pin) されているか。
        - 不要なパッケージ／キャッシュが残っていないか (イメージサイズと攻撃面の最小化)。
        - 機密情報 (鍵 / トークン) が ARG / ENV / COPY 経由で露出していないか。
        - root のまま実行していないか、非 root ユーザ切替を検討すべきか。
    - path: "**/*.php"
      instructions: |
        PHP コードとしてレビューしてください:
        - 外部入力を SQL に直接連結していないか (プリペアド・パラメータ化が徹底されているか)。
        - `echo` / テンプレート出力でエスケープ漏れ (XSS) が無いか。
        - `include` / `require` のパスに外部入力が混入していないか (LFI)。
        - ファイルアップロード処理のバリデーション (拡張子・MIME・サイズ) が抜けていないか。
    - path: ".github/workflows/**"
      instructions: |
        GitHub Actions ワークフローとしてレビューしてください:
        - シークレットの露出 (echo / set-output 経由のリーク) が無いか。
        - 外部 action は SHA pin されているか。
        - permissions: が最小権限になっているか。

  # ビルド生成物 / キャッシュなどはレビュー対象から除外する。
  # CodeRabbit の path_filters は gitignore 形式で、`!` プレフィックスは
  # 「（除外パターンから）再度含める」意味になるため、除外目的では `!` を付けない。
  # 本リポジトリは PHP + Docker 構成のため、現存する技術スタックに関連する最小限のみ列挙する。
  path_filters:
    - "**/dist/**"
    - "**/build/**"
    - "**/coverage/**"
    - "db/**"

  abort_on_close: true

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
